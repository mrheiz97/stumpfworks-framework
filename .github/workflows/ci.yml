name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: swf
          POSTGRES_PASSWORD: swf-test-only
          POSTGRES_DB: swf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swf -d swf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -tags=integration ./test/integration
        env:
          SWF_TEST_POSTGRES_URL: postgres://swf:swf-test-only@127.0.0.1:5432/swf_test?sslmode=disable
      - run: go build ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
